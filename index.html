<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Product View</title>
  <!-- Tailwind CSS for sleek, professional UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="max-w-6xl mx-auto px-4 py-12">
    <!-- Product Container -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
      
      <!-- LEFT: Image Gallery Section -->
      <div class="space-y-4">
        <!-- Main Hero Image Display -->
        <div class="w-full h-96 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center border border-slate-200">
          <img id="main-display" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80" alt="Product Main" class="w-full h-full object-cover transition-all duration-300">
        </div>
        
        <!-- Thumbnails (Multiple Images) -->
        <div class="grid grid-cols-4 gap-2">
          <button onclick="changeImage('https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80')" class="thumbnail-btn border-2 border-slate-900 rounded-md overflow-hidden aspect-square bg-slate-100">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=150&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
          </button>
          <button onclick="changeImage('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=80')" class="thumbnail-btn border-2 border-transparent hover:border-slate-300 rounded-md overflow-hidden aspect-square bg-slate-100">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=150&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
          </button>
          <button onclick="changeImage('https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=600&auto=format&fit=crop&q=80')" class="thumbnail-btn border-2 border-transparent hover:border-slate-300 rounded-md overflow-hidden aspect-square bg-slate-100">
            <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=150&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
          </button>
          <button onclick="changeImage('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80')" class="thumbnail-btn border-2 border-transparent hover:border-slate-300 rounded-md overflow-hidden aspect-square bg-slate-100">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
          </button>
        </div>
      </div>

      <!-- RIGHT: Product Info & Action Area -->
      <div class="flex flex-col justify-between space-y-6">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Premium Collection</span>
          <h1 class="text-3xl font-bold text-slate-900 mt-1 mb-3">Minimalist Smart Gadget</h1>
          <p class="text-2xl font-semibold text-slate-700 mb-4">₦25,000</p>
          <p class="text-slate-600 leading-relaxed">
            Experience premium craftsmanship mixed with top-tier industrial design. Built seamlessly to integrate with your modern workflow setup.
          </p>
        </div>

        <!-- Interactive Delivery Fee Display Block -->
        <div class="bg-slate-100 border border-slate-200 rounded-lg p-4 transition-all duration-300">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-slate-600">Standard Delivery Fee</span>
            <!-- Visible directly contextually upon viewing -->
            <span id="delivery-fee-badge" class="text-sm font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded border border-emerald-200">
              ₦1,500
            </span>
          </div>
          <p class="text-xs text-slate-500 mt-1">Dispatched from our main hub within 24–48 hours.</p>
        </div>

        <!-- Checkout Actions -->
        <div class="space-y-3">
          <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 px-6 rounded-lg transition-colors shadow-sm tracking-wide">
            Add to Bag
          </button>
          <button class="w-full bg-white hover:bg-slate-50 text-slate-700 font-medium py-3.5 px-6 rounded-lg border border-slate-300 transition-colors">
            Check Availability
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript for Interactive Gallery Handling -->
  <script>
    function changeImage(imageUrl) {
      // 1. Swap main image display source
      const mainImg = document.getElementById('main-display');
      mainImg.src = imageUrl;

      // 2. Clear out active borders on all thumbnails
      const thumbnails = document.querySelectorAll('.thumbnail-btn');
      thumbnails.forEach(btn => btn.classList.remove('border-slate-900'));
      thumbnails.forEach(btn => btn.classList.add('border-transparent'));

      // 3. Highlight the active target thumbnail button
      const targetBtn = event.currentTarget;
      targetBtn.classList.remove('border-transparent');
      targetBtn.classList.add('border-slate-900');
    }
  </script>
</body>
</html>
