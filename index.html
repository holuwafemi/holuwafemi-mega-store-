<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holuwafemi Mega Store - Premium Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Paystack Inline JS v2 -->
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --primary-dark: #1e293b;
            --secondary: #059669;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); }
        header { background-color: var(--white); border-bottom: 1px solid var(--border-color); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo-area h1 { font-size: 22px; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
        .promo-banner-billboard { background: linear-gradient(135deg, #0f172a, #1e293b); color: var(--white); padding: 40px 5%; text-align: center; border-bottom: 4px solid var(--secondary); }
        .promo-banner-billboard h2 { font-size: 28px; margin-bottom: 10px; }
        .section-container { padding: 30px 5%; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 5px; }
        .cat-btn { background: var(--white); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); color: var(--white); border-color: var(--primary); }
        .products-grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .grid-product-card { background: var(--white); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; cursor: pointer; position: relative; transition: transform 0.2s; display: flex; flex-direction: column; }
        .grid-product-card:hover { transform: translateY(-2px); }
        .grid-product-card img { width: 100%; height: 130px; object-fit: contain; margin-bottom: 10px; border-radius: 6px; }
        .product-title { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; height: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .modal-overlay-sheet { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; display: none; overflow-y: auto; }
        .modal-body-wrapper { background: var(--white); width: 90%; max-width: 500px; margin: 50px auto; border-radius: 16px; padding: 25px; position: relative; }
        .modal-close-trigger { position: absolute; top: 15px; right: 15px; background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .modal-main-img { width: 100%; height: 220px; object-fit: contain; border-radius: 8px; background: #f8fafc; }
        .btn-action-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
        .btn-buy { background-color: var(--secondary); color: white; }
        .btn-buy-primary { background-color: var(--primary); color: white; }
        footer { background: #0f172a; color: #94a3b8; padding: 40px 5%; text-align: center; font-size: 14px; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Holuwafemi Mega Store</h1>
        </div>
    </header>

    <div class="promo-banner-billboard">
        <h2>Premium Quality, Unbeatable Deals</h2>
        <p>Explore original phones, solar gear, appliances, and luxury electronics with instant checkout.</p>
    </div>

    <div class="section-container">
        <div class="section-title"><i class="fas fa-store" style="color:var(--secondary)"></i> Catalog Inventory</div>
        <div class="tabs-container" id="categoryTabsBar">
            <button class="cat-btn active" data-cat="all">All Items</button>
            <button class="cat-btn" data-cat="electronics">Electronics</button>
            <button class="cat-btn" data-cat="solar">Solar</button>
            <button class="cat-btn" data-cat="appliances">Appliances</button>
            <button class="cat-btn" data-cat="computers">Computers</button>
            <button class="cat-btn" data-cat="phones">Phones</button>
            <button class="cat-btn" data-cat="fashion">Fashion</button>
        </div>
        <div class="products-grid-layout" id="mainCatalogGrid"></div>
    </div>

    <!-- PRODUCT DETAILS MODAL -->
    <div class="modal-overlay-sheet" id="productModal">
        <div class="modal-body-wrapper">
            <button class="modal-close-trigger" id="closeDetailsBtn">×</button>
            <img src="" id="mImg" class="modal-main-img" alt="Product Image">
            <h3 id="mName" style="margin-top:15px; font-size:18px;"></h3>
            <div id="mPrice" class="product-price" style="font-size:22px; color:var(--secondary); margin: 8px 0;">₦0</div>
            <p id="mDesc" style="font-size:14px; color:#475569; margin-bottom:20px; max-height:120px; overflow-y:auto;"></p>
            
            <button id="directBuyBtn" class="btn-action-primary btn-buy-primary"><i class="fas fa-bolt"></i> INSTANT BUY NOW</button>
        </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div class="modal-overlay-sheet" id="checkoutModal">
        <div class="modal-body-wrapper">
            <button class="modal-close-trigger" id="closeCheckoutBtn">×</button>
            <div style="text-align:center;">
                <i class="fas fa-shield-alt" style="font-size:32px; color:var(--secondary); margin-bottom:8px;"></i>
                <h3 style="font-size:18px;">Order Details</h3>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px; margin:15px 0;">
                <input type="text" id="checkoutName" class="cat-btn" style="width:100%; border-radius:8px; text-align:left; padding:0 12px; height:40px;" placeholder="Full Name" required>
                <input type="email" id="checkoutEmail" class="cat-btn" style="width:100%; border-radius:8px; text-align:left; padding:0 12px; height:40px;" placeholder="Email Address" required>
                <input type="tel" id="checkoutPhone" class="cat-btn" style="width:100%; border-radius:8px; text-align:left; padding:0 12px; height:40px;" placeholder="Phone Number" required>
                <input type="text" id="checkoutAddress" class="cat-btn" style="width:100%; border-radius:8px; text-align:left; padding:0 12px; height:40px;" placeholder="Delivery Address" required>
            </div>
            <div style="background:#f1f5f9; padding:12px; border-radius:8px; text-align:center; margin-bottom:15px;">
                <span style="font-size:11px; text-transform:uppercase; font-weight:700; display:block;">Payable Amount</span>
                <span id="checkoutPayableAmount" style="font-size:24px; font-weight:800;">₦0</span>
            </div>
            <button id="paystackTriggerBtn" class="btn-action-primary btn-buy"><i class="fas fa-lock"></i> PAY NOW VIA PAYSTACK</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Holuwafemi Mega Store. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAl6irx9QKiJeHJ2Xu2VUkNUJyNy2ud6cg",
            authDomain: "holuwafemi-mega-store.firebaseapp.com",
            projectId: "holuwafemi-mega-store",
            storageBucket: "holuwafemi-mega-store.firebasestorage.app",
            messagingSenderId: "1002214759367",
            appId: "1:1002214759367:web:0f3afecb88c0f8a0f397e2"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], selectedProduct = null, checkoutAmount = 0;

        function safeFormat(val) {
            const num = Number(val);
            return isNaN(num) ? "0" : num.toLocaleString();
        }

        onSnapshot(query(collection(db, "products"), orderBy("timestamp", "desc")), (snapshot) => {
            allProducts = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.status !== "pending") {
                    allProducts.push({ id: doc.id, ...data });
                }
            });
            renderProducts("all");
        });

        function renderProducts(cat) {
            const grid = document.getElementById("mainCatalogGrid");
            grid.innerHTML = "";
            const items = cat === "all" ? allProducts : allProducts.filter(p => p.category === cat);
            items.forEach(p => {
                const img = Array.isArray(p.images) ? p.images[0] : (p.imageUrl || 'https://via.placeholder.com/150');
                const el = document.createElement("div");
                el.className = "grid-product-card";
                el.innerHTML = `
                    <img src="${img}">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">₦${safeFormat(p.price)}</div>
                `;
                el.onclick = () => openModal(p);
                grid.appendChild(el);
            });
        }

        // Category Tabs listener
        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                renderProducts(e.target.dataset.cat);
            });
        });

        function openModal(p) {
            selectedProduct = p;
            document.getElementById("mName").innerText = p.name;
            document.getElementById("mPrice").innerText = "₦" + safeFormat(p.price);
            document.getElementById("mDesc").innerText = p.description || "";
            document.getElementById("mImg").src = Array.isArray(p.images) ? p.images[0] : (p.imageUrl || 'https://via.placeholder.com/150');
            document.getElementById("productModal").style.display = "block";
        }

        // Modal Close Controls
        document.getElementById("closeDetailsBtn").onclick = () => document.getElementById("productModal").style.display = "none";
        document.getElementById("closeCheckoutBtn").onclick = () => document.getElementById("checkoutModal").style.display = "none";

        // Direct Checkout
        document.getElementById("directBuyBtn").onclick = () => {
            checkoutAmount = Number(selectedProduct.price) + Number(selectedProduct.deliveryFee || 0);
            document.getElementById("checkoutPayableAmount").innerText = "₦" + safeFormat(checkoutAmount);
            document.getElementById("productModal").style.display = "none";
            document.getElementById("checkoutModal").style.display = "block";
        };

        // Paystack Trigger
        document.getElementById("paystackTriggerBtn").onclick = () => {
            const name = document.getElementById("checkoutName").value.trim();
            const email = document.getElementById("checkoutEmail").value.trim();
            const phone = document.getElementById("checkoutPhone").value.trim();
            const address = document.getElementById("checkoutAddress").value.trim();
            if (!name || !email || !phone || !address) return alert("Fill all fields.");

            const paystack = new PaystackPop();
            paystack.newTransaction({
                key: 'pk_live_e64fc7ce9677d4f5f4f4e4cb89999c51f52a1475',
                email: email,
                amount: Math.round(checkoutAmount * 100),
                currency: "NGN",
                onSuccess: async (transaction) => {
                    alert("Payment successful! Ref: " + transaction.reference);
                    await addDoc(collection(db, "orders"), {
                        customerName: name, customerEmail: email, customerPhone: phone,
                        deliveryAddress: address, amountPaid: checkoutAmount,
                        paystackReference: transaction.reference, status: "Paid", timestamp: serverTimestamp()
                    });
                    document.getElementById("checkoutModal").style.display = "none";
                }
            });
        };
    </script>
</body>
</html>
