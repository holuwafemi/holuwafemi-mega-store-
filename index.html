<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holuwafemi Mega Store - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;       /* Deep Slate Charcoal */
            --primary-dark: #1e293b;  /* Dark Slate Accent */
            --secondary: #059669;     /* Trustworthy Muted Emerald */
            --bg-light: #f8fafc;      /* Clean Light Gray */
            --text-main: #0f172a;     /* High Contrast Charcoal */
            --text-muted: #64748b;    /* Slate Gray Subtexts */
            --white: #ffffff;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-main);
        }
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area h1 {
            font-size: 22px;
            color: var(--primary);
            font-weight: 800;
        }
        .main-container {
            max-w: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        @media(min-width: 768px) {
            .main-container { grid-template-columns: 400px 1fr; }
        }
        .panel-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--secondary);
            background: var(--white);
        }
        textarea.form-control {
            resize: vertical;
            height: 80px;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
        }
        
        /* Product List Styles */
        .product-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .product-list-item:last-child { border-bottom: none; }
        .product-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .product-info img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 6px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
        }
        .product-meta h4 { font-size: 14px; font-weight: 600; }
        .product-meta p { font-size: 12px; color: var(--text-muted); }
        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Holuwafemi Control Desk</h1>
        </div>
        <div class="header-actions">
            <span style="font-size: 14px; font-weight: 600; color: var(--text-muted);"><i class="fas fa-user-shield"></i> Store Manager</span>
        </div>
    </header>

    <div class="main-container">
        
        <!-- LEFT PANEL: Add/Edit Product -->
        <div class="panel-card">
            <div class="panel-title"><i class="fas fa-plus-circle"></i> Inventory Control Form</div>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label for="productName">Product Title</label>
                    <input type="text" id="productName" class="form-control" placeholder="e.g., Original Solar Inverter 5KVA" required>
                </div>
                
                <div class="form-group">
                    <label for="productCategory">Category Link</label>
                    <select id="productCategory" class="form-control" required>
                        <option value="electronics">Electronics</option>
                        <option value="solar">Solar</option>
                        <option value="appliances">Appliances</option>
                        <option value="computers">Computers</option>
                        <option value="phones">Phones</option>
                        <option value="fashion">Fashion</option>
                    </select>
                </div>

                <!-- UPDATED FIELD: Multi-image URL Handler -->
                <div class="form-group">
                    <label for="productImages">Product Image URLs (Separate with Commas)</label>
                    <textarea id="productImages" class="form-control" placeholder="https://link1.com/img1.jpg, https://link2.com/img2.jpg, https://link3.com/img3.jpg" required></textarea>
                    <small style="font-size:11px; color:var(--text-muted); display:block; margin-top:4px;">Paste image links separated with a comma for multiple view selection support.</small>
                </div>

                <div class="form-group">
                    <label for="productPrice">Selling Price (₦)</label>
                    <input type="number" id="productPrice" class="form-control" placeholder="25000" required>
                </div>

                <div class="form-group">
                    <label for="productOldPrice">Slashed / Old Price (₦ - Optional)</label>
                    <input type="number" id="productOldPrice" class="form-control" placeholder="32000">
                </div>

                <!-- NEW FIELD: Delivery Fee Setup -->
                <div class="form-group">
                    <label for="productDeliveryFee">Delivery Fee Tracking Value (₦)</label>
                    <input type="number" id="productDeliveryFee" class="form-control" placeholder="1500" value="0" required>
                    <small style="font-size:11px; color:var(--text-muted); display:block; margin-top:4px;">Type 0 if delivery for this product is completely free.</small>
                </div>

                <div class="form-group">
                    <label for="productDesc">Technical Specifications / Description</label>
                    <textarea id="productDesc" class="form-control" placeholder="Provide core detailed documentation rules regarding the listing inventory items here..." required></textarea>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="topSellerCheck"> Trending Highlight
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="featuredCheck"> Featured item
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">UPLOAD PRODUCT TO CATALOG</button>
            </form>
        </div>

        <!-- RIGHT PANEL: Current Inventory Live Monitor -->
        <div class="panel-card">
            <div class="panel-title"><i class="fas fa-boxes"></i> Active Catalog Inventory List</div>
            <div id="adminInventoryList" style="max-height: 650px; overflow-y: auto;">
                <!-- Synced real-time list populated via Firebase -->
            </div>
        </div>

    </div>

    <!-- FIREBASE INITIALIZATION AND CONTROL SYSTEMS MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAl6irx9QKiJeHJ2Xu2VUkNUJyNy2ud6cg",
            authDomain: "holuwafemi-mega-store.firebaseapp.com",
            projectId: "holuwafemi-mega-store",
            storageBucket: "holuwafemi-mega-store.firebasestorage.app",
            messagingSenderId: "1002214759367",
            appId: "1:1002214759367:web:0f3afecb88c0f8a0f397e2",
            measurementId: "G-WPFKNZ20E3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const productsCollection = collection(db, "products");

        const productForm = document.getElementById("productForm");
        const inventoryContainer = document.getElementById("adminInventoryList");

        // SAVE & UPLOAD LOGIC 
        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("productCategory").value;
            const imagesRawString = document.getElementById("productImages").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const oldPrice = document.getElementById("productOldPrice").value ? Number(document.getElementById("productOldPrice").value) : null;
            const deliveryFee = Number(document.getElementById("productDeliveryFee").value);
            const description = document.getElementById("productDesc").value.trim();
            const topSeller = document.getElementById("topSellerCheck").checked;
            const featured = document.getElementById("featuredCheck").checked;

            // Process the comma-separated text input into a clean string array
            const imagesArray = imagesRawString.split(",")
                                                .map(url => url.trim())
                                                .filter(url => url.length > 0);

            if (imagesArray.length === 0) {
                alert("Please add at least one clear Image URL address.");
                return;
            }

            try {
                document.getElementById("submitBtn").innerText = "SAVING MATRIX ROUTINE...";
                document.getElementById("submitBtn").disabled = true;

                // Payload package matching frontend expectations perfectly
                await addDoc(productsCollection, {
                    name,
                    category,
                    images: imagesArray, // Saved as clean Array structure
                    price,
                    oldPrice,
                    deliveryFee,        // New field variable item tracking
                    description,
                    topSeller,
                    featured,
                    timestamp: serverTimestamp()
                });

                alert("Product saved to catalog database loop smoothly!");
                productForm.reset();
            } catch (err) {
                console.error("Firestore Upload Error: ", err);
                alert("Upload breakdown context tracking issue. Try again.");
            } finally {
                document.getElementById("submitBtn").innerText = "UPLOAD PRODUCT TO CATALOG";
                document.getElementById("submitBtn").disabled = false;
            }
        });

        // LIVE REAL-TIME FEED OF REGISTERED PRODUCTS
        const productsQuery = query(productsCollection, orderBy("timestamp", "desc"));
        onSnapshot(productsQuery, (snapshot) => {
            inventoryContainer.innerHTML = "";
            
            if(snapshot.empty) {
                inventoryContainer.innerHTML = `<p style="text-align:center; padding:30px; color:var(--text-muted);">No products running on global pipeline grids.</p>`;
                return;
            }

            snapshot.forEach((productDoc) => {
                const item = productDoc.data();
                const itemId = productDoc.id;

                // Safely fetch fallback display thumbnail values context
                const displayImg = Array.isArray(item.images) ? item.images[0] : (item.imageUrl || 'https://via.placeholder.com/150');

                const itemRow = document.createElement("div");
                itemRow.className = "product-list-item";
                itemRow.innerHTML = `
                    <div class="product-info">
                        <img src="${displayImg}" alt="">
                        <div class="product-meta">
                            <h4>${item.name}</h4>
                            <p>Cat: <b>${item.category}</b> | Price: ₦${Number(item.price).toLocaleString()} | Delivery: ₦${item.deliveryFee ? Number(item.deliveryFee).toLocaleString() : '0'}</p>
                        </div>
                    </div>
                    <button class="btn-delete" data-id="${itemId}" title="Delete Record"><i class="fas fa-trash-alt"></i></button>
                `;

                // DELETE CALL LOGIC
                itemRow.querySelector(".btn-delete").addEventListener("click", async (el) => {
                    if (confirm("Are you sure you want to completely erase this product from global database storefronts?")) {
                        const targetsId = el.currentTarget.getAttribute("data-id");
                        await deleteDoc(doc(db, "products", targetsId));
                        alert("Product purged successfully!");
                    }
                });

                inventoryContainer.appendChild(itemRow);
            });
        });
    </script>
</body>
</html>
