<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holuwafemi Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --secondary: #059669; --bg: #f8fafc; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--primary); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--white); padding: 15px 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: var(--secondary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button.btn-danger { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Holuwafemi Store Management</h2>
        <div>
            <a href="index.html" style="margin-right: 15px; text-decoration: none; color: var(--primary); font-weight: bold;"><i class="fas fa-store"></i> View Storefront</a>
            <button onclick="logoutAdmin()" class="btn-danger" style="width: auto; display: inline-block;">Logout</button>
        </div>
    </div>

    <div class="grid">
        <div>
            <div class="card">
                <h3>Add New Product</h3>
                <form id="addProductForm">
                    <input type="text" id="pName" placeholder="Product Title" required>
                    <input type="number" id="pPrice" placeholder="Price (₦)" required>
                    <input type="number" id="pOldPrice" placeholder="Old Price (₦)">
                    <input type="number" id="pDelivery" placeholder="Delivery Fee (₦)">
                    <select id="pCat">
                        <option value="electronics">Electronics</option>
                        <option value="solar">Solar</option>
                        <option value="appliances">Appliances</option>
                        <option value="computers">Computers</option>
                        <option value="phones">Phones</option>
                        <option value="fashion">Fashion</option>
                    </select>
                    <input type="text" id="pImages" placeholder="Image URLs (comma separated)" required>
                    <textarea id="pDesc" placeholder="Product Description"></textarea>
                    <button type="submit">Upload Product</button>
                </form>
            </div>
        </div>

        <div>
            <div class="card">
                <h3>Live Customer Orders</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Phone / Address</th>
                            <th>Amount</th>
                            <th>Ref</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>Product Inventory Management</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            alert("Unauthorized access! Redirecting...");
            window.location.href = "index.html";
        }

        window.logoutAdmin = () => {
            localStorage.removeItem("isAdminLoggedIn");
            window.location.href = "index.html";
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAl6irx9QKiJeHJ2Xu2VUkNUJyNy2ud6cg",
            authDomain: "holuwafemi-mega-store.firebaseapp.com",
            projectId: "holuwafemi-mega-store",
            storageBucket: "holuwafemi-mega-store.firebasestorage.app",
            messagingSenderId: "1002214759367",
            appId: "1:1002214759367:web:0f3afecb88c0f8a0f397e2"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Upload Form
        document.getElementById("addProductForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const imagesArr = document.getElementById("pImages").value.split(",").map(s => s.trim());
            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById("pName").value,
                    price: Number(document.getElementById("pPrice").value),
                    oldPrice: Number(document.getElementById("pOldPrice").value) || null,
                    deliveryFee: Number(document.getElementById("pDelivery").value) || 0,
                    category: document.getElementById("pCat").value,
                    images: imagesArr,
                    description: document.getElementById("pDesc").value,
                    timestamp: serverTimestamp()
                });
                alert("Product Added Successfully!");
                e.target.reset();
            } catch(err) {
                alert("Error adding product: " + err.message);
            }
        });

        // Load Inventory
        onSnapshot(query(collection(db, "products"), orderBy("timestamp", "desc")), (snap) => {
            const body = document.getElementById("inventoryTableBody");
            body.innerHTML = "";
            snap.forEach((docSnap) => {
                const p = docSnap.data();
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${p.name}</td>
                    <td>₦${Number(p.price).toLocaleString()}</td>
                    <td>${p.category}</td>
                    <td><button class="btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deleteProduct('${docSnap.id}')">Delete</button></td>
                `;
                body.appendChild(row);
            });
        });

        window.deleteProduct = async (id) => {
            if (confirm("Delete this product permanently?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // Load Orders
        onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snap) => {
            const body = document.getElementById("ordersTableBody");
            body.innerHTML = "";
            snap.forEach((docSnap) => {
                const o = docSnap.data();
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><b>${o.customerName}</b><br><small>${o.customerEmail}</small></td>
                    <td>${o.customerPhone}<br><small>${o.deliveryAddress}</small></td>
                    <td>₦${Number(o.amountPaid).toLocaleString()}</td>
                    <td><small>${o.paystackReference}</small></td>
                `;
                body.appendChild(row);
            });
        });
    </script>
</body>
</html>
