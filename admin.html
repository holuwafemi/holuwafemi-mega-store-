<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holuwafemi Mega Store - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .admin-container {
            max-width: 700px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h2 {
            margin-bottom: 8px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }
        .ai-btn-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }
        .ai-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .ai-btn:hover {
            background: #059669;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin: 15px 0 25px 0;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 6px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn:hover {
            background: var(--primary-dark);
        }
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2><i class="fas fa-box-open" style="color: var(--primary);"></i> Stock Inventory Control</h2>
        <p class="subtitle">Upload and configure products directly to Holuwafemi Mega Store</p>

        <!-- Product Title -->
        <div class="form-group">
            <label for="prodName">Product Title</label>
            <input type="text" id="prodName" class="form-control" placeholder="e.g., iPhone 15 Pro Max 256GB">
        </div>

        <!-- Category & Prices Row -->
        <div class="form-row">
            <div class="form-group">
                <label for="prodCategory">Product Category</label>
                <select id="prodCategory" class="form-control">
                    <option value="electronics">Electronics</option>
                    <option value="solar">Solar</option>
                    <option value="appliances">Appliances</option>
                    <option value="computers">Computers</option>
                    <option value="phones">Phones</option>
                    <option value="fashion">Fashion</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="prodPrice">Selling Price (₦)</label>
                <input type="number" id="prodPrice" class="form-control" placeholder="e.g., 1250000">
            </div>
            <div class="form-group">
                <label for="prodOldPrice">Slash Price / Old Price (₦ - Optional)</label>
                <input type="number" id="prodOldPrice" class="form-control" placeholder="e.g., 1400000">
            </div>
        </div>

        <!-- Product Image Link -->
        <div class="form-group">
            <label for="prodImageUrl">Product Image Link URL</label>
            <input type="url" id="prodImageUrl" class="form-control" placeholder="https://images.unsplash.com/... or your hosting link">
        </div>

        <!-- Product Description & AI Generator -->
        <div class="form-group">
            <label for="prodDesc">Product Specifications / Description</label>
            <textarea id="prodDesc" class="form-control" placeholder="Type specific details or use the local AI system generation helper..."></textarea>
            <div class="ai-btn-wrapper">
                <button type="button" id="activateAiBtn" class="ai-btn">
                    <i class="fas fa-robot"></i> Activate AI System
                </button>
            </div>
        </div>

        <!-- Badges Settings -->
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="prodTopSeller">
                Mark as Top Dynamic Seller
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="prodFeatured">
                Mark as Featured / Trending
            </label>
        </div>

        <!-- Action Submission Trigger -->
        <button type="button" id="submitProductBtn" class="submit-btn">
            <i class="fas fa-cloud-upload-alt"></i> UPLOAD PRODUCT NOW
        </button>
    </div>

    <!-- ADMIN PANEL CORE SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Firebase Configuration (Matching Holuwafemi Mega Store Credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyAl6irx9QKiJeHJ2Xu2VUkNUJyNy2ud6cg",
            authDomain: "holuwafemi-mega-store.firebaseapp.com",
            projectId: "holuwafemi-mega-store",
            storageBucket: "holuwafemi-mega-store.firebasestorage.app",
            messagingSenderId: "1002214759367",
            appId: "1:1002214759367:web:0f3afecb88c0f8a0f397e2",
            measurementId: "G-WPFKNZ20E3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOCAL BUILT-IN AUTO RECOGNITION GENERATOR (Replaces external API Keys) ---
        const localAiTemplates = {
            phones: "Original premium smartphone. High-capacity battery life, high-resolution crystal camera display, factory unlocked with complete accessories and valid store warranty included.",
            electronics: "High-performance premium electronic device. Engineered for power efficiency, durable build quality, and seamless modern integration.",
            appliances: "Home and office luxury appliance. Energy-saving technology certification, ergonomic layout, built to withstand local voltage fluctuations.",
            solar: "High-efficiency monocrystalline solar equipment. Perfect for inverter backup setups, deep cycle stability, built for Nigerian weather conditions.",
            computers: "High-speed professional computing system. Optimized for heavy multitasking, crisp graphics capabilities, processing power, and upgraded storage capacity.",
            fashion: "Premium high-quality luxury fashion wear. Comfortable fit, exquisite texture details, tailored perfectly for corporate and casual elegant appearances."
        };

        // Activated locally without popping up errors asking for keys
        document.getElementById("activateAiBtn").addEventListener("click", () => {
            const productName = document.getElementById("prodName").value.trim();
            const category = document.getElementById("prodCategory").value;
            const descField = document.getElementById("prodDesc");

            if (!productName) {
                alert("Please type a Product Title first so the system knows what to generate description details for!");
                return;
            }

            // Generate localized marketing text content seamlessly
            const baseTemplate = localAiTemplates[category] || "Premium high-quality guaranteed product specifications details.";
            descField.value = `Brand New ${productName}. ${baseTemplate}`;
            
            // Subtle visual success confirmation cue
            descField.style.borderColor = "#10b981";
            setTimeout(() => descField.style.borderColor = "#e2e8f0", 1500);
        });


        // --- FIRESTORE PRODUCT UPLOAD AND INVENTORY CREATION ---
        document.getElementById("submitProductBtn").addEventListener("click", async () => {
            const name = document.getElementById("prodName").value.trim();
            const price = Number(document.getElementById("prodPrice").value);
            const oldPrice = document.getElementById("prodOldPrice").value ? Number(document.getElementById("prodOldPrice").value) : null;
            const category = document.getElementById("prodCategory").value;
            const description = document.getElementById("prodDesc").value.trim();
            const imageUrl = document.getElementById("prodImageUrl").value.trim();
            const isTopSeller = document.getElementById("prodTopSeller").checked;
            const isFeatured = document.getElementById("prodFeatured").checked;

            if (!name || !price || !category || !imageUrl) {
                alert("Please fill in the Product Title, Category, Price, and Image Link address!");
                return;
            }

            try {
                document.getElementById("submitProductBtn").innerText = "UPLOADING TO STORE...";
                document.getElementById("submitProductBtn").disabled = true;

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: price,
                    oldPrice: oldPrice,
                    category: category,
                    description: description || "Premium high-quality guaranteed product specifications details.",
                    imageUrl: imageUrl,
                    topSeller: isTopSeller,
                    featured: isFeatured,
                    timestamp: serverTimestamp()
                });

                alert("Product listed successfully on Holuwafemi Mega Store!");
                
                // Reset form on database success pipeline execution
                document.getElementById("prodName").value = "";
                document.getElementById("prodPrice").value = "";
                document.getElementById("prodOldPrice").value = "";
                document.getElementById("prodDesc").value = "";
                document.getElementById("prodImageUrl").value = "";
                document.getElementById("prodTopSeller").checked = false;
                document.getElementById("prodFeatured").checked = false;

            } catch (error) {
                console.error("Error writing new document database record profiles: ", error);
                alert("Database save failure. Please verify connection credentials parameters.");
            } finally {
                document.getElementById("submitProductBtn").innerText = "UPLOAD PRODUCT NOW";
                document.getElementById("submitProductBtn").disabled = false;
            }
        });
    </script>
</body>
</html>
